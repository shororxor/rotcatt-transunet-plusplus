[project]
name = "rotcatt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bao Nguyen", email = "bao.nguyen@u.nus.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "hausdorff>=0.2.6",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.1",
    "nibabel>=5.4.2",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "simpleitk>=2.5.6",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[project.scripts]
rotcatt = "rotcatt:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
